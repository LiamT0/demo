<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171817">
  <meta name="description" content="Cleaning Crew field service management demo.">
  <title>Cleaning Crew | Operations</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="workspace">
    <aside class="sidebar">
      <a class="brand" href="#dashboard"><span aria-hidden="true">✦</span> Cleaning Crew</a>
      <nav aria-label="Workspace">
        <p class="nav-label">OPERATIONS</p>
        <a href="#dashboard">Dashboard</a><a href="#schedule">Schedule</a><a href="#jobs">Jobs</a><a href="#clients">Clients</a>
        <p class="nav-label">BUSINESS</p>
        <a href="#quotes">Quotes</a><a href="#invoices">Invoices</a><a href="#services">Services</a>
      </nav>
      <p class="demo-label">Demo workspace<br><span>Records are saved in this browser.</span></p>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="record-form">
      <header class="dialog-heading">
        <h2 id="editor-title"></h2>
        <button class="quiet icon-button" type="button" data-dismiss aria-label="Close">×</button>
      </header>
      <div id="fields"></div>
      <p id="form-error" class="notice error" role="alert" hidden></p>
      <footer class="form-actions">
        <button class="button secondary" type="button" data-dismiss>Cancel</button>
        <button class="button primary" type="submit">Save</button>
      </footer>
    </form>
  </dialog>
  <p id="status" class="toast" role="status" aria-live="polite" hidden></p>
</body>
</html>
